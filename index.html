<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tata Pricing Tool</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h2>Tata Pricing Tool</h2>

  <div class="topbar">

    <!-- Margin -->
    <input
      type="number"
      id="margin"
      placeholder="Margin %"
      value="20"
      oninput="applyFilters()"
    />

    <!-- Commission -->
    <input
      type="number"
      id="commission"
      placeholder="Commission %"
      value="37"
      oninput="applyFilters()"
    />

    <!-- Processing Fee -->
    <input
      type="number"
      id="processingFee"
      placeholder="Processing Fee"
      value="99"
      oninput="applyFilters()"
    />

    <!-- Search -->
    <input
      type="text"
      id="search"
      placeholder="Search Product / SKU / Listing ID"
      onkeyup="applyFilters()"
    />

    <!-- Brand -->
    <select
      id="brandFilter"
      onchange="applyFilters()"
    >
      <option value="">All Brands</option>
    </select>

    <!-- Status -->
    <select
      id="statusFilter"
      onchange="applyFilters()"
    >
      <option value="">All Status</option>
    </select>

    <!-- Buttons -->
    <button onclick="loadData()">
      Reload Data
    </button>

    <button onclick="downloadCSV()">
      Download CSV
    </button>

  </div>

  <div class="table-container">

    <table id="table">

      <thead></thead>

      <tbody></tbody>

    </table>

  </div>

  <script src="script.js"></script>

</body>

</html>
